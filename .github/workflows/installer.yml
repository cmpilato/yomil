name: Installer

# Dev builds: every push to main (or Actions > Installer > Run workflow, from any branch)
# builds the installer as version {next patch}.dev{run}+{sha}, e.g. 1.3.1.dev118+abc1234
# after v1.3.0. Releases are made by release.yml instead.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.version }}
      file_version: ${{ steps.versions.outputs.file_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release tags
      - id: versions
        env:
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          PYTHONPATH=src python3 -m yomil.devtools.versioning dev --run "$RUN" --sha "$SHA" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build-installer.yml
    with:
      version: ${{ needs.version.outputs.version }}
      file_version: ${{ needs.version.outputs.file_version }}
